  <path d="M38 39 H42" fill="none" stroke="#EEF3E7" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="38" cy="28" r="1.8" fill="#EEF3E7"/>
  <circle cx="49" cy="34" r="1.8" fill="#EEF3E7"/>

  <!-- circuit traces: left page -->
  <path d="M26 26 H20 V32 H15" fill="none" stroke="#B8860B" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 39 H22" fill="none" stroke="#B8860B" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="26" cy="26" r="1.8" fill="#B8860B"/>
  <circle cx="15" cy="32" r="1.8" fill="#B8860B"/>
</svg>